<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ice Breaker</title>
    <link rel="stylesheet" href="https://unpkg.com/mvp.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chgibb/css-spinners@2.2.1/css/spinner/three-quarters.min.css">
</head>
<body>
    <header>
        <form id="name-form" style="margin: 0 auto">
            <h1>Ice Breaker</h1>
            <input type="text" name="name" placeholder="Enter Company Name">
            <button id="magic-button" type="submit" class="center">Load Products</button>
        </form>
    </header>

    <div id="spinner" style="text-align: center; display: none">
        <span class="three-quarters-loader" style="width: 100px; height: 100px; border-radius: 50%; border-width: 12px;"></span>
    </div>

    <main id="result" style="display: none">
        <div>
            <h2>Summary</h2>
            <p id="summary"></p>
        </div>
        <div>
    <h2>Product Info</h2>
    <div id="ProductList"></div>
</div>
    </main>

    <script>
        const form = document.getElementById("name-form");
        const spinner = document.getElementById("spinner");
        const result = document.getElementById("result");

        form.addEventListener("submit", (ev) => {
            ev.preventDefault();

            result.style.display = "none";
            spinner.style.display = "";

            const formData = new FormData(form);

           fetch("/process", {
                method: "POST",
                body: formData
                })
                .then(response => response.json())
                .then(data => {
                const parsed = data.summary_and_products;
                const products = parsed.ProductList || [];

                if (products.length === 0) {
                    alert("No products returned.");
                    spinner.style.display = "none";
                    return;
                }

                document.getElementById("summary").textContent = parsed.summary;

                const productListContainer = document.getElementById("ProductList");
                productListContainer.innerHTML = "";

                // Loop through and render each product as a card/block
                products.forEach((product, index) => {
                    const container = document.createElement("div");
                    container.style.border = "1px solid #ccc";
                    container.style.padding = "1em";
                    container.style.marginBottom = "1em";
                    container.style.borderRadius = "8px";

                    const title = document.createElement("h3");
                    title.textContent = `Product ${index + 1}: ${product.Product}`;

                    const price = document.createElement("p");
                    price.innerHTML = `<strong>Price:</strong> ${product.Price}`;

                    const blurb = document.createElement("p");
                    blurb.innerHTML = `<strong>Marketing Blurb:</strong> ${product["Marketing Blurb"]}`;

                    const benefitsLabel = document.createElement("p");
                    benefitsLabel.innerHTML = `<strong>Benefits:</strong>`;

                    const benefitList = document.createElement("ul");
                    product.Benefit.forEach(b => {
                        const li = document.createElement("li");
                        li.textContent = b;
                        benefitList.appendChild(li);
                    });

                    // Assemble and append
                    container.appendChild(title);
                    container.appendChild(price);
                    container.appendChild(blurb);
                    container.appendChild(benefitsLabel);
                    container.appendChild(benefitList);

                    productListContainer.appendChild(container);
                });

                spinner.style.display = "none";
                result.style.display = "";
                });
        });

        function createHtmlList(element, items) {
            const ul = document.createElement("ul");
            items.forEach(item => {
                const li = document.createElement("li");
                li.textContent = item;
                ul.appendChild(li);
            });
            element.innerHTML = "";
            element.appendChild(ul);
        }
    </script>
</body>
</html>
